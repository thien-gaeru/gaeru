services:
  - type: web
    name: gaeru-store-staging
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm test
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: disable
      - key: DATABASE_URL
        fromDatabase:
          name: gaeru-store-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: gaeru-store-staging-db
    databaseName: gaeru_store
    user: gaeru_store
    plan: free
    region: singapore
    postgresMajorVersion: "16"

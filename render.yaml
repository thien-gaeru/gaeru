services:
  - type: web
    name: gaeru-store-staging
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm test
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NEON_STORAGE_UPLOADS_ENABLED
        value: "true"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: disable
      - key: DATABASE_URL
        fromDatabase:
          name: gaeru-store-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: gaeru-store-staging-db
    databaseName: gaeru_store
    user: gaeru_store
    plan: free
    region: singapore
    postgresMajorVersion: "16"

description "GAERU GPU AI Engine (Adreno 540 OpenCL 2.0)"
start on runlevel [2345]
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start script
  /usr/local/sbin/ubuntu-mount.sh
  mkdir -p /storage/ubuntu/var/cache/gaeru-gpu-ai/llama.cpp
  chown -R 33:33 /storage/ubuntu/var/cache/gaeru-gpu-ai
  if [ ! -x /storage/ubuntu/usr/local/bin/gaeru-gpu-ai ]; then
    echo "gaeru-gpu-ai: missing binary in chroot"
    stop; exit 0
  fi
end script

script
  ulimit -n 16384 2>/dev/null || true
  echo -100 > /proc/$$/oom_score_adj 2>/dev/null || true
  export HOME="/var/cache/gaeru-gpu-ai"
  export XDG_CACHE_HOME="/var/cache/gaeru-gpu-ai"
  export GGML_OPENCL_PLATFORM="QUALCOMM"
  export GAERU_GPU_AI_HOST="127.0.0.1"
  export GAERU_GPU_AI_PORT="3100"
  export GAERU_GPU_AI_LLAMA_PORT="3101"
  export PATH="/usr/local/bin:/usr/bin:/bin"
  exec /usr/sbin/chroot --userspec=33:33 /storage/ubuntu /usr/local/bin/gaeru-gpu-ai
end script

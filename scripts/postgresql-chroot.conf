description "PostgreSQL (Ubuntu 26 chroot)"

start on (local-filesystems and net-device-up IFACE!=lo) or runlevel [2345]
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start exec /usr/local/sbin/ubuntu-mount.sh

script
  ulimit -n 65535 2>/dev/null || true
  echo -500 > /proc/$$/oom_score_adj 2>/dev/null || true
  VER=18
  exec chroot --userspec=999:997 --groups=997,998 /storage/ubuntu /usr/bin/env -i LANG=C.UTF-8 \
    /usr/lib/postgresql/$VER/bin/postgres -D /var/lib/postgresql/$VER/main \
    -c config_file=/etc/postgresql/$VER/main/postgresql.conf
end script

description "Node.js app instance (Ubuntu 26 runtime)"
# Usage: start node-app APP=<name>   (config in /storage/apps/<name>/app.env)

instance $APP
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start script
  case "$APP" in
    ''|*[!A-Za-z0-9_-]*)
      echo "node-app: invalid APP name"
      stop; exit 0
      ;;
  esac
  /usr/local/sbin/ubuntu-mount.sh
  [ -f "/storage/apps/$APP/app.env" ] || { echo "missing /storage/apps/$APP/app.env"; stop; exit 0; }
end script

script
  case "$APP" in
    ''|*[!A-Za-z0-9_-]*)
      echo "node-app: invalid APP name" >&2
      exit 1
      ;;
  esac
  ulimit -n 65535 2>/dev/null || true
  echo -200 > /proc/$$/oom_score_adj 2>/dev/null || true
  PORT=3000; ENTRY=server.js; RUNUSER=33:33
  # Strip inherited variables first so ENV_* secrets never appear in /proc/*/cmdline argv.
  for _var in $(env | cut -d= -f1); do
    case "$_var" in
      APP|PORT|ENTRY|RUNUSER|UPSTART_*) ;;
      *) unset "$_var" 2>/dev/null || true ;;
    esac
  done
  while IFS= read -r _line || [ -n "$_line" ]; do
    _line=$(printf '%s' "$_line" | tr -d '\r')
    case "$_line" in
      ''|'#'*) continue ;;
      PORT=*)
        _v="${_line#PORT=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        case "$_v" in ''|*[!0-9]*) echo "node-app: invalid PORT" >&2; exit 1 ;; esac
        PORT="$_v"
        ;;
      ENTRY=*)
        _v="${_line#ENTRY=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        case "$_v" in ''|*..*|*[!A-Za-z0-9_./-]*) echo "node-app: invalid ENTRY" >&2; exit 1 ;; esac
        ENTRY="$_v"
        ;;
      RUNUSER=*)
        _v="${_line#RUNUSER=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        case "$_v" in ''|*[!A-Za-z0-9_:-]*) echo "node-app: invalid RUNUSER" >&2; exit 1 ;; esac
        RUNUSER="$_v"
        ;;
      ENV_[A-Za-z_][A-Za-z0-9_]*=*)
        _k="${_line%%=*}"; _k="${_k#ENV_}"
        _v="${_line#*=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        export "$_k=$_v"
        ;;
    esac
  done < "/storage/apps/$APP/app.env"
  export HOME="/storage/apps/$APP" LANG="C.UTF-8" NODE_ENV="production" PORT="$PORT" PATH="/usr/local/bin:/usr/bin:/bin"
  exec chroot --userspec="$RUNUSER" /storage/ubuntu /bin/sh -c 'cd "/storage/apps/$1" && exec node "$2"' _ "$APP" "$ENTRY"
end script

description "Node.js app instance (Ubuntu 26 runtime)"
# Usage: start node-app APP=<name>   (config in /storage/apps/<name>/app.env)

instance $APP
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start script
  /usr/local/sbin/ubuntu-mount.sh
  [ -f /storage/apps/$APP/app.env ] || { echo "missing /storage/apps/$APP/app.env"; stop; exit 0; }
end script

script
  ulimit -n 65535 2>/dev/null || true
  echo -200 > /proc/$$/oom_score_adj 2>/dev/null || true
  PORT=3000; ENTRY=server.js; RUNUSER=33:33
  . /storage/apps/$APP/app.env
  exec chroot --userspec=$RUNUSER /storage/ubuntu /usr/bin/env -i \
    HOME=/storage/apps/$APP LANG=C.UTF-8 NODE_ENV=production PORT=$PORT \
    PATH=/usr/local/bin:/usr/bin:/bin \
    $(grep -E '^ENV_[A-Za-z0-9_]+=' /storage/apps/$APP/app.env | sed 's/^ENV_//') \
    /bin/sh -c "cd /storage/apps/$APP && exec node $ENTRY"
end script

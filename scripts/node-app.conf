description "Node.js app instance (Ubuntu 26 runtime)"
# Usage: start node-app APP=<name>   (config in /storage/apps/<name>/app.env)

instance $APP
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start script
  case "$APP" in
    ''|*[!A-Za-z0-9_-]*)
      echo "node-app: invalid APP name"
      stop; exit 0
      ;;
  esac
  /usr/local/sbin/ubuntu-mount.sh
  [ -f "/storage/apps/$APP/app.env" ] && [ ! -L "/storage/apps/$APP/app.env" ] || { echo "missing or unsafe /storage/apps/$APP/app.env"; stop; exit 0; }
  [ "$(stat -c %u "/storage/apps/$APP/app.env" 2>/dev/null)" = "0" ] || { echo "unsafe owner on /storage/apps/$APP/app.env (expected root)"; stop; exit 0; }
end script

script
  case "$APP" in
    ''|*[!A-Za-z0-9_-]*)
      echo "node-app: invalid APP name" >&2
      exit 1
      ;;
  esac
  [ -f "/storage/apps/$APP/app.env" ] && [ ! -L "/storage/apps/$APP/app.env" ] || { echo "node-app: missing or symlink app.env" >&2; exit 1; }
  [ "$(stat -c %u "/storage/apps/$APP/app.env" 2>/dev/null)" = "0" ] || { echo "node-app: app.env must be owned by root" >&2; exit 1; }
  ulimit -n 65535 2>/dev/null || true
  echo -200 > /proc/$$/oom_score_adj 2>/dev/null || true
  PORT=3000; ENTRY=server.js; RUNUSER="33:33"
  # Strip inherited variables first so host/upstart secrets never leak into the app environment.
  for _var in $(env | cut -d= -f1); do
    case "$_var" in
      APP|PATH|PORT|ENTRY|RUNUSER|UPSTART_*) ;;
      *) unset "$_var" 2>/dev/null || true ;;
    esac
  done
  while IFS= read -r _line || [ -n "$_line" ]; do
    _line=$(printf '%s' "$_line" | tr -d '\r')
    case "$_line" in
      ''|'#'*) continue ;;
      PORT=*)
        _v="${_line#PORT=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        case "$_v" in ''|*[!0-9]*) echo "node-app: invalid PORT" >&2; exit 1 ;; esac
        PORT="$_v"
        ;;
      ENTRY=*)
        _v="${_line#ENTRY=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        case "$_v" in ''|*..*|*[!A-Za-z0-9_./-]*) echo "node-app: invalid ENTRY" >&2; exit 1 ;; esac
        ENTRY="$_v"
        ;;
      RUNUSER=*)
        # RUNUSER is hardcoded to numeric 33:33 (www-data) for Mi 6 chroot NSS safety; ignore app.env overrides.
        continue
        ;;
      ENV_[A-Za-z_]=*|ENV_[A-Za-z_][A-Za-z0-9_]*=*)
        _k="${_line%%=*}"; _k="${_k#ENV_}"
        case "$_k" in
          ''|[0-9]*|*[!A-Za-z0-9_]*)
            echo "node-app: rejected invalid ENV key" >&2
            continue
            ;;
          APP|ENTRY|PORT|NODE_ENV|LANG|LD_*|PRELOAD*|PATH|IFS|BASH_ENV|ENV|RUNUSER|HOME|USER|SHELL|TMPDIR|GCONV_PATH|LOCPATH)
            echo "node-app: blocked restricted ENV key: $_k" >&2
            continue
            ;;
        esac
        _v="${_line#*=}"
        case "$_v" in \"*\") _v="${_v#\"}"; _v="${_v%\"}" ;; \'*\') _v="${_v#\'}"; _v="${_v%\'}" ;; esac
        if [ "$_k" = "NODE_OPTIONS" ]; then
          case "$_v" in
            --max-old-space-size=[0-9]*)
              case "${_v#--max-old-space-size=}" in
                ''|*[!0-9]*) echo "node-app: blocked unsafe NODE_OPTIONS" >&2; continue ;;
                *) export "NODE_OPTIONS=$_v" ;;
              esac
              ;;
            *) echo "node-app: blocked restricted ENV key: $_k" >&2; continue ;;
          esac
        elif [ "$_k" = "MALLOC_ARENA_MAX" ]; then
          case "$_v" in ''|*[!0-9]*) continue ;; esac
          MALLOC_ARENA_MAX="$_v"
        else
          export "$_k=$_v"
        fi
        ;;
    esac
  done < "/storage/apps/$APP/app.env"
  export MALLOC_ARENA_MAX="${MALLOC_ARENA_MAX:-2}"
  export HOME="/storage/apps/$APP" LANG="C.UTF-8" NODE_ENV="production" PORT="$PORT" PATH="/usr/local/bin:/usr/bin:/bin"
  exec /usr/sbin/chroot --userspec="$RUNUSER" /storage/ubuntu /bin/sh -c 'cd "/storage/apps/$1" && exec node "$2"' _ "$APP" "$ENTRY"
end script

description "Mi 6 Admin panel (Node.js v26 on Ubuntu 26, port 8080)"

start on (local-filesystems and net-device-up IFACE!=lo) or runlevel [2345]
stop on runlevel [016]

respawn
respawn limit 10 60

pre-start exec /usr/local/sbin/ubuntu-mount.sh
chdir /storage/admin
exec /usr/local/sbin/host-node /storage/admin/server.js

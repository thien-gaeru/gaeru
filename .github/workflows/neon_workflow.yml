name: Create/Delete Branch for Pull Request

permissions: {}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions: {}
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get sanitized branch name
        id: branch_name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          SAFE_BRANCH="$(printf '%s' "$HEAD_REF" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-50)"
          if [ -z "$SAFE_BRANCH" ]; then
            SAFE_BRANCH="pr-${PR_NUMBER}"
          fi
          echo "current_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    permissions: {}
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date (2 weeks from now)
        id: get_expiration_date
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.get_expiration_date.outputs.expires_at }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action == 'closed'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
